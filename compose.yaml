services:
  feishu-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-bridge:local
    container_name: feishu-bridge
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    volumes:
      - feishu_bridge_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  feishu_bridge_data:
